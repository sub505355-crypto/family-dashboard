<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>검증 후 정리</title>
</head>
<body>
<script>
/* 임시 정리 페이지: 검증용으로 심은 이 기기 저장값만 지우고 대시보드를 연다(실제 Firebase에는 쓰지 않음). 사용 후 삭제한다. */
(function () {
  try {
    ['mongle-family-v1', 'mongle-family-v1-seen-v1',
     'junyun-family-v1', 'junyun-family-v1-seen-v1'].forEach(function (k) {
      localStorage.removeItem(k);
    });
  } catch (e) {}
  location.replace('./index.html');
})();
</script>
</body>
</html>
